plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = '4.0.4'
group = 'net.blockomorph'
archivesBaseName = "blockomorph-1.21.3-fabric"
testmodid = 'blockomorph'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
        name = "Modrinth"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.3"
    mappings loom.officialMojangMappings()
    
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.112.1+1.21.3"

    modImplementation "maven.modrinth:balm:21.3.5+fabric-1.21.3"
    modImplementation "maven.modrinth:waystones:21.3.3+fabric-1.21.3"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

remapJar {
    destinationDirectory = file("D:\\SERVER\\mods\\mod\\blockomorph\\jar\\outPut")
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from "LICENSE"
}

repositories {
}