import com.google.gson.GsonBuilder
import com.google.gson.JsonObject
import com.google.gson.JsonParser

plugins {
    id 'eclipse'
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.fabricmc.fabric-loom' version '1.15.4' apply false
}

subprojects {
    apply plugin: 'java'
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    processResources {
        def rawProps = new Properties()
        rootProject.file("gradle.properties").withInputStream { rawProps.load(it) }
        def configProps = new HashMap<>(rawProps)
        inputs.properties(configProps)
        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
            expand(configProps)
        }
    }
}

ext {
    patchRefmaps = { List<String> cfgs, String refMapName, FileCollection outputs ->
        outputs.forEach { path ->
            cfgs.forEach {cfg ->
                File file = new File(path, cfg)
                def jsonElement = JsonParser.parseString(file.text)
                JsonObject json = jsonElement.getAsJsonObject()
                if (!json.has("refmap")) {
                    json.addProperty("refmap", refMapName)
                    file.text = new GsonBuilder().setPrettyPrinting().create().toJson(json)
                }
            }
        }
    }
}