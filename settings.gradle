pluginManagement {
    plugins {
        id 'fabric-loom' version fabric_loom
        id 'net.neoforged.moddev' version neoforge_gradle
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = "https://maven.sinytra.org/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'blockomorph'
include 'common'
include 'neoforge'
include 'fabric'
