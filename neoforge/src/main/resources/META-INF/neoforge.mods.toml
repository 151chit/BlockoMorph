modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT License"

[[mods]]
modId = "blockomorph"
version = "${mod_version}"
displayName = "Block'oMorph"
logoFile = "logo.png"
authors = "151gamemode1chit"
description = "This mod allows players morph into blocks with all the main features of the block."

[[dependencies.blockomorph]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_loader_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.blockomorph]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "AFTER"
side = "BOTH"




[[mixins]]
config = "mixins.blockomorph.json"

[[mixins]]
config = "mixins.blockomorph.neoforge.json"
