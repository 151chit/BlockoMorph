plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin' version '0.7.+'
}

base.archivesName = "blockomorph-" + minecraft_version + "-forge-" + mod_version

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            client(true)
            getArgs().addAll('--username', 'Opa')
        }

        server {
            client(false)
        }

        twoClient {
            client(true)
        }

        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs.add("-Xmx" + min_memoryGb + "G")
            jvmArgs.add("-Xms" + max_memoryGb + "G")
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "net.minecraftforge:forge:1.20.1-" + forge_loader_version
    implementation("io.github.llamalad7:mixinextras-forge:0.3.5")
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '0.3.5')

    runtimeOnly fileTree(dir: 'run/fabricAdapter', include: ['*.jar'])

    implementation fileTree(dir: 'run/mods', include: ['*.jar'])
    implementation fileTree(dir: 'run/mods/fabricApi', include: ['*.jar'])
}

mixin {
    add(sourceSets.main, "blockomorph.refmap.json")

    config("mixins.blockomorph.json")
    config("mixins.blockomorph.neoforge.json")
}

sourceSets.main.java.srcDirs += project(":common").sourceSets.main.java.srcDirs
sourceSets.main.resources.srcDirs += project(":common").sourceSets.main.resources.srcDirs

jar {
    String outputPath = System.getenv().BLOCKOMORPH_OUTPUT
    if (outputPath != null) destinationDirectory = file(outputPath)
}